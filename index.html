<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: #7a5f22;
    --bg: #0b0b0e;
    --bg2: #111118;
    --text: #f0ece3;
    --muted: #7a7670;
    --border: rgba(201,168,76,0.18);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.5;
  }

  /* Radial glow */
  body::after {
    content: '';
    position: fixed;
    top: -10%;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 500px;
    background: radial-gradient(ellipse, rgba(201,168,76,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6rem 2rem 5rem;
  }

  /* Top nav line */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.5rem 3rem;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    background: rgba(11,11,14,0.7);
    z-index: 50;
    animation: slideDown 0.8s ease forwards;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--gold);
  }

  .nav-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: pulse 2s ease-in-out infinite;
  }

  /* Hero content */
  .hero {
    text-align: center;
    max-width: 800px;
    width: 100%;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 0.72rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 2rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.3s ease forwards;
  }

  .eyebrow::before, .eyebrow::after {
    content: '';
    display: block;
    width: 32px;
    height: 1px;
    background: var(--gold-dim);
  }

  .headline {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 8vw, 6.5rem);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 0.9s 0.5s ease forwards;
  }

  .headline em {
    font-style: italic;
    color: var(--gold);
  }

  .subline {
    font-size: 1rem;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.7;
    max-width: 480px;
    margin: 0 auto 3.5rem;
    opacity: 0;
    animation: fadeUp 0.9s 0.7s ease forwards;
  }

  /* Countdown */
  .countdown {
    display: flex;
    justify-content: center;
    gap: clamp(1rem, 3vw, 2.5rem);
    margin-bottom: 3.5rem;
    opacity: 0;
    animation: fadeUp 0.9s 0.9s ease forwards;
  }

  .time-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .time-block .num {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    font-weight: 700;
    line-height: 1;
    color: var(--text);
    width: clamp(70px, 10vw, 110px);
    text-align: center;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6em 0.3em;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .time-block .num::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    height: 1px;
    background: var(--border);
  }

  .time-block .num:hover {
    border-color: var(--gold-dim);
  }

  .time-block .label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .countdown-sep {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: var(--gold-dim);
    align-self: center;
    padding-bottom: 1.6rem;
    line-height: 1;
  }

  /* Email form */
  .form-wrap {
    opacity: 0;
    animation: fadeUp 0.9s 1.1s ease forwards;
    width: 100%;
    max-width: 480px;
    margin: 0 auto 2.5rem;
  }

  .form-row {
    display: flex;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .form-row:focus-within {
    border-color: var(--gold-dim);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
  }

  .form-row input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 0.9rem 1.2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--text);
  }

  .form-row input::placeholder { color: var(--muted); }

  .form-row button {
    background: var(--gold);
    color: #0b0b0e;
    border: none;
    padding: 0.9rem 1.5rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .form-row button:hover { background: var(--gold-light); }

  .form-note {
    text-align: center;
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.75rem;
    letter-spacing: 0.05em;
  }

  .success-msg {
    display: none;
    text-align: center;
    color: var(--gold);
    font-size: 0.9rem;
    padding: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: rgba(201,168,76,0.05);
  }

  /* Social links */
  .socials {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    opacity: 0;
    animation: fadeUp 0.9s 1.3s ease forwards;
  }

  .socials a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--muted);
    text-decoration: none;
    transition: border-color 0.2s, color 0.2s;
  }

  .socials a:hover {
    border-color: var(--gold-dim);
    color: var(--gold);
  }

  .socials a svg { width: 16px; height: 16px; fill: currentColor; }

  /* Bottom bar */
  .footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 3rem;
    border-top: 1px solid var(--border);
    backdrop-filter: blur(12px);
    background: rgba(11,11,14,0.7);
    z-index: 50;
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    animation: slideUp 0.8s ease forwards;
  }

  /* Decorative line element */
  .deco-line {
    width: 1px;
    height: 60px;
    background: linear-gradient(to bottom, transparent, var(--gold-dim), transparent);
    margin: 0 auto 2rem;
    opacity: 0;
    animation: fadeIn 1s 0.4s ease forwards;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes slideDown {
    from { transform: translateY(-100%); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* iPad (768px – 1024px) */
  @media (max-width: 1024px) {
    .nav { padding: 1.3rem 2rem; }
    .footer { padding: 1rem 2rem; }
    .wrapper { padding: 7rem 2.5rem 5rem; }
  }

  /* Mobile (up to 767px) */
  @media (max-width: 767px) {
    .nav { padding: 1rem 1.25rem; }
    .wrapper { padding: 7rem 1.25rem 6rem; justify-content: flex-start; }
    .footer { padding: 0.9rem 1.25rem; flex-direction: column; gap: 0.4rem; text-align: center; }
    .countdown-sep { display: none; }
    .countdown { gap: 0.6rem; }
    .time-block .num {
      width: clamp(64px, 20vw, 80px);
      font-size: clamp(1.8rem, 7vw, 2.4rem);
      padding: 0.5em 0.2em;
    }
    .time-block .label { font-size: 0.6rem; letter-spacing: 0.15em; }
    .eyebrow { font-size: 0.65rem; letter-spacing: 0.18em; }
    .eyebrow::before, .eyebrow::after { width: 20px; }
    .subline { font-size: 0.92rem; margin-bottom: 2.5rem; }
    .deco-line { height: 40px; margin-bottom: 1.5rem; }
    .form-row { flex-direction: column; }
    .form-row input { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); }
    .form-row button { width: 100%; padding: 0.85rem; border-radius: 0; }
  }

  /* Small phones (up to 400px) */
  @media (max-width: 400px) {
    .wrapper { padding: 6.5rem 1rem 5.5rem; }
    .countdown { gap: 0.4rem; }
    .time-block .num { width: clamp(58px, 19vw, 72px); font-size: clamp(1.6rem, 6.5vw, 2rem); }
  }
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-logo"> ╭─❖ νινιη gℓσвαℓ ❖─╮</span>
  <span class="nav-status">
    <span class="status-dot"></span>
    In Development
  </span>
</nav>

<div class="wrapper">
  <div class="hero">

    <span class="eyebrow">Something new is coming</span>

    <div class="deco-line"></div>

    <h1 class="headline">
      We're <em>almost</em> ready.
    </h1>

    <p class="subline">
      A new experience is being crafted with care. Sign up to be the first to know when we launch.
    </p>

    <div class="countdown" id="countdown">
      <div class="time-block">
        <div class="num" id="days">00</div>
        <div class="label">Days</div>
      </div>
      <span class="countdown-sep">:</span>
      <div class="time-block">
        <div class="num" id="hours">00</div>
        <div class="label">Hours</div>
      </div>
      <span class="countdown-sep">:</span>
      <div class="time-block">
        <div class="num" id="minutes">00</div>
        <div class="label">Minutes</div>
      </div>
      <span class="countdown-sep">:</span>
      <div class="time-block">
        <div class="num" id="seconds">00</div>
        <div class="label">Seconds</div>
      </div>
    </div>

  </div>
</div>

<footer class="footer">
  <span>© 2026 νινιη gℓσвαℓ. All rights reserved.</span>
  <span>Privacy Policy · Terms</span>
</footer>

<script>
  // Countdown to a target date — set yours here
  const target = new Date();
  target.setDate(target.getDate() + 7);
  target.setHours(target.getHours() + 9, target.getMinutes() + 33);

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    const diff = target - now;
    if (diff <= 0) {
      document.getElementById('days').textContent = '00';
      document.getElementById('hours').textContent = '00';
      document.getElementById('minutes').textContent = '00';
      document.getElementById('seconds').textContent = '00';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('days').textContent = pad(d);
    document.getElementById('hours').textContent = pad(h);
    document.getElementById('minutes').textContent = pad(m);
    document.getElementById('seconds').textContent = pad(s);
  }

  tick();
  setInterval(tick, 1000);

  function handleSubmit() {
    const val = document.getElementById('emailInput').value.trim();
    if (!val || !val.includes('@')) {
      document.getElementById('emailInput').style.outline = '1px solid #c9a84c';
      setTimeout(() => document.getElementById('emailInput').style.outline = '', 1200);
      return;
    }
    document.getElementById('formRow').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  }

  document.getElementById('emailInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSubmit();
  });
</script>
</body>
</html>
